<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 펄스 | 30분 단위 커뮤니티 화제글 TOP 3</title>
    <meta name="description" content="에펨코리아, 루리웹, 인스티즈, 디시 주식갤·부동산갤의 공개 게시판을 30분마다 수집해 유사한 글을 묶고 조회수+댓글수 기준 TOP 3를 누적 기록하는 대시보드">
    <!-- Google Fonts Pretendard & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Dynamic Glow Effects -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>
    <div class="glow-bg glow-3"></div>

    <div class="app-layout">
        <!-- Header Section -->
        <header class="navbar glass">
            <div class="nav-brand">
                <div class="brand-logo">
                    <span class="material-symbols-rounded pulse-icon">rss_feed</span>
                </div>
                <div class="brand-text">
                    <h1>Community Pulse</h1>
                    <span class="brand-subtitle">공개 커뮤니티 5곳 · 30분 단위 수집</span>
                </div>
            </div>

            <!-- Collection Status -->
            <div class="timer-widget">
                <div class="timer-info">
                    <span class="live-dot" title="30분 주기 수집"></span>
                    <span class="timer-label">다음 수집 예정까지</span>
                    <span class="timer-countdown" id="countdownDisplay">--:--</span>
                </div>
                <div class="timer-progress-bar">
                    <div class="timer-progress-fill" id="timerProgressBar"></div>
                </div>
                <div class="timer-meta">
                    <span id="lastUpdatedTime">수집 기록 불러오는 중…</span>
                </div>
            </div>

            <!-- Global Actions -->
            <div class="nav-actions">
                <button class="btn btn-outline refresh-btn" id="manualRefreshBtn" title="최신 스냅샷 다시 불러오기">
                    <span class="material-symbols-rounded" id="refreshIcon">refresh</span>
                    <span class="btn-text">새로고침</span>
                </button>
            </div>
        </header>

        <!-- Real-time Hot Keywords Bar -->
        <section class="trending-bar glass">
            <div class="trending-title">
                <span class="material-symbols-rounded hot-fire">local_fire_department</span>
                <span>이번 수집 빈출 키워드</span>
            </div>
            <div class="trending-tags" id="trendingKeywords">
                <!-- Keywords injected by JS -->
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="main-container">
            <!-- Filter Bar & Search -->
            <div class="filter-wrapper glass">
                <!-- Community Pill Filters -->
                <div class="community-tabs" id="communityTabs">
                    <!-- Dynamic community pills rendered by JS -->
                </div>

                <div class="topic-row">
                    <!-- Snapshot history selector -->
                    <div class="history-control">
                        <label class="history-label" for="snapshotSelect">
                            <span class="material-symbols-rounded">history</span>
                            수집 시점
                        </label>
                        <select id="snapshotSelect" class="history-select"></select>
                        <button class="btn btn-outline btn-small" id="latestBtn">최신으로</button>
                    </div>

                    <div class="search-box">
                        <span class="material-symbols-rounded search-icon">search</span>
                        <input type="text" id="searchInput" placeholder="제목 키워드 검색...">
                        <button class="clear-search hidden" id="clearSearchBtn">
                            <span class="material-symbols-rounded">cancel</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Source status panel -->
            <section class="source-status glass" id="sourceStatus">
                <!-- Per-source collection status injected by JS -->
            </section>

            <!-- Feed Header -->
            <div class="feed-header">
                <div class="feed-count-summary">
                    <span id="activeFilterName">전체 커뮤니티</span>
                    <span class="count-number" id="newsTotalCount">-</span>
                </div>
            </div>

            <!-- TOP 3 cluster cards -->
            <div class="news-grid" id="newsGrid">
                <!-- Cards rendered dynamically by JS -->
            </div>

            <!-- 7-day keyword cloud -->
            <section class="viz-root keyword-section glass">
                <div class="viz-head">
                    <div class="viz-title-group">
                        <h2>
                            <span class="material-symbols-rounded">tag</span>
                            7일간 키워드 노출량
                        </h2>
                        <p class="viz-subtitle" id="keywordSubtitle">-</p>
                    </div>
                    <div class="viz-views" role="tablist" aria-label="키워드 표시 방식">
                        <button class="viz-view-btn active" data-view="cloud" role="tab" aria-selected="true">클라우드</button>
                        <button class="viz-view-btn" data-view="bar" role="tab" aria-selected="false">막대</button>
                        <button class="viz-view-btn" data-view="table" role="tab" aria-selected="false">표</button>
                    </div>
                </div>

                <div class="viz-scale-legend">
                    <span class="scale-label">노출량 적음</span>
                    <span class="scale-swatch s5"></span>
                    <span class="scale-swatch s4"></span>
                    <span class="scale-swatch s3"></span>
                    <span class="scale-swatch s2"></span>
                    <span class="scale-swatch s1"></span>
                    <span class="scale-label">많음</span>
                    <span class="scale-note">글자 크기·색이 같은 값(노출량)을 나타냅니다</span>
                </div>

                <div class="viz-panel" id="keywordCloud" role="img" aria-label="7일간 키워드 노출량 워드클라우드"></div>
                <div class="viz-panel hidden" id="keywordBar"></div>
                <div class="viz-panel hidden" id="keywordTable"></div>

                <p class="viz-footnote" id="keywordFootnote"></p>
            </section>

            <!-- Accumulated timeline -->
            <section class="timeline-section glass">
                <div class="timeline-head">
                    <h2>
                        <span class="material-symbols-rounded">timeline</span>
                        누적 수집 이력
                    </h2>
                    <span class="timeline-sub" id="timelineSub">-</span>
                </div>
                <div class="timeline-list" id="timelineList">
                    <!-- Past snapshots injected by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
